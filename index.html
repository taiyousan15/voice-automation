<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI情報ポッドキャスト - 最新トレンド自動配信</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            line-height: 1.6;
            color: #333;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 2rem;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 16px;
            padding: 2rem;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        h1 {
            color: #667eea;
            margin-bottom: 0.5rem;
            font-size: 2rem;
        }
        .subtitle {
            color: #666;
            margin-bottom: 2rem;
            font-size: 1rem;
        }
        .rss-section {
            background: #f7f9fc;
            border-left: 4px solid #667eea;
            padding: 1rem;
            margin-bottom: 2rem;
            border-radius: 8px;
        }
        .rss-url {
            font-family: monospace;
            background: white;
            padding: 0.5rem;
            border-radius: 4px;
            word-break: break-all;
            font-size: 0.9rem;
            color: #667eea;
        }
        .episode {
            border: 1px solid #e1e8ed;
            border-radius: 8px;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
            transition: all 0.3s ease;
        }
        .episode:hover {
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.15);
            border-color: #667eea;
        }
        .episode-title {
            color: #667eea;
            font-size: 1.3rem;
            margin-bottom: 0.5rem;
            font-weight: 600;
        }
        .episode-meta {
            color: #888;
            font-size: 0.9rem;
            margin-bottom: 1rem;
        }
        .articles {
            margin-top: 1rem;
        }
        .article {
            padding: 0.5rem 0;
            border-bottom: 1px solid #f0f0f0;
        }
        .article:last-child { border-bottom: none; }
        .article-title {
            color: #333;
            font-weight: 500;
        }
        .article-meta {
            color: #888;
            font-size: 0.85rem;
            margin-top: 0.25rem;
        }
        .trust-score {
            display: inline-block;
            background: #667eea;
            color: white;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 0.75rem;
            font-weight: 600;
        }
        .badge {
            display: inline-block;
            background: #e1e8ed;
            color: #666;
            padding: 4px 12px;
            border-radius: 16px;
            font-size: 0.8rem;
            margin-right: 0.5rem;
        }
        .footer {
            text-align: center;
            margin-top: 3rem;
            padding-top: 2rem;
            border-top: 1px solid #e1e8ed;
            color: #888;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎙️ AI情報ポッドキャスト</h1>
        <p class="subtitle">AIビジネス、バイブコーディング、エージェント活用など、最新AI情報を毎日自動配信</p>
        
        <div class="rss-section">
            <strong>📡 RSS Feed URL:</strong><br>
            <div class="rss-url" id="rss-url">https://USERNAME.github.io/REPO_NAME/episodes/feed.xml</div>
        </div>

        <h2 style="margin-bottom: 1.5rem; color: #333;">📚 最新エピソード</h2>
        <div id="episodes"></div>

        <div class="footer">
            🤖 Powered by Podcast Automation System<br>
            Generated with NewsData.io + Groq Llama 3.3 70B + Fish Audio
        </div>
    </div>

    <script>
        // Load and display episodes from summary.json
        fetch('summary.json')
            .then(response => response.json())
            .then(data => {
                const container = document.getElementById('episodes');
                data.episodes.forEach((ep, index) => {
                    const div = document.createElement('div');
                    div.className = 'episode';
                    
                    const articlesHtml = ep.articles.map(a => `
                        <div class="article">
                            <div class="article-title">${a.title}</div>
                            <div class="article-meta">
                                ${a.source} • <span class="trust-score">${a.trust_score}/10</span>
                            </div>
                        </div>
                    `).join('');
                    
                    div.innerHTML = `
                        <div class="episode-title">エピソード ${index + 1}: ${ep.theme}</div>
                        <div class="episode-meta">
                            <span class="badge">${ep.status}</span>
                            <span class="badge">${ep.articles.length} articles</span>
                            ${ep.audio_url ? '<span class="badge">🎵 Audio</span>' : ''}
                        </div>
                        <div class="articles">
                            <strong>記事一覧:</strong>
                            ${articlesHtml}
                        </div>
                    `;
                    container.appendChild(div);
                });
            })
            .catch(err => {
                document.getElementById('episodes').innerHTML = 
                    '<p style="color: #888;">エピソードを読み込めませんでした。</p>';
            });
    </script>
</body>
</html>
