name: Podcast Automation Pipeline

on:
  schedule:
    - cron: '0 21 * * *'  # 06:00 JST = 21:00 UTC前日
  workflow_dispatch:  # Manual trigger

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install FFmpeg (for audio conversion)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Start VOICEVOX Docker (TTS fallback)
        run: |
          docker pull voicevox/voicevox_engine:latest
          docker run -d --name voicevox -p 50021:50021 voicevox/voicevox_engine:latest
          echo "Waiting for VOICEVOX to start..."
          for i in $(seq 1 30); do
            if curl -s http://localhost:50021/version > /dev/null 2>&1; then
              echo "VOICEVOX is ready"
              break
            fi
            sleep 2
          done

      - name: Create episodes directory
        run: mkdir -p episodes

      - name: Run Pipeline
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          NEWSDATA_API_KEY: ${{ secrets.NEWSDATA_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FISH_AUDIO_API_KEY: ${{ secrets.FISH_AUDIO_API_KEY }}
          FISH_AUDIO_VOICE_ID: ${{ secrets.FISH_AUDIO_VOICE_ID }}
          VOICEVOX_API_URL: http://localhost:50021
          GITHUB_PAGES_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
          FISH_AUDIO_TIMEOUT_SECONDS: 240
        run: |
          python3 -m src.orchestrator --enable-audio

      - name: Upload Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: podcast-outputs-${{ github.run_id }}
          path: episodes/
          retention-days: 30

      - name: Upload RSS Feed
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: rss-feed-${{ github.run_id }}
          path: episodes/feed.xml
          retention-days: 90

      - name: Deploy to GitHub Pages
        if: success()
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./episodes
          keep_files: false
          commit_message: "chore: deploy podcast episodes and RSS feed"

      - name: Notify on Failure
        if: failure()
        run: |
          echo "❌ Pipeline failed. Check logs for details."
          echo "Run ID: ${{ github.run_id }}"
          echo "Run URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
