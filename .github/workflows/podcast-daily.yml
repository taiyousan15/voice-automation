name: Daily Podcast Generation

on:
  # 毎日00:00 UTC (09:00 JST)に自動実行
  schedule:
    - cron: '0 0 * * *'
  
  # 手動実行も可能
  workflow_dispatch:
    inputs:
      themes:
        description: 'Custom themes (comma-separated)'
        required: false
        default: ''

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  generate-podcast:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
      
      - name: Load configuration
        id: config
        run: |
          pip install pyyaml
          python3 << 'PYEOF'
          import yaml
          import os
          
          with open('config.yaml', 'r', encoding='utf-8') as f:
              config = yaml.safe_load(f)
          
          # Extract themes
          themes = config.get('themes', [])
          themes_str = ','.join(themes[:5])  # Top 5 themes
          
          # Set GitHub output
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f"themes={themes_str}\n")
          PYEOF
      
      - name: Generate podcast episode
        env:
          NEWSDATA_API_KEY: ${{ secrets.NEWSDATA_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FISH_AUDIO_API_KEY: ${{ secrets.FISH_AUDIO_API_KEY }}
          FISH_AUDIO_VOICE_ID: ${{ secrets.FISH_AUDIO_VOICE_ID }}
        run: |
          # Use custom themes if provided, otherwise use config
          if [ -n "${{ github.event.inputs.themes }}" ]; then
            THEMES="${{ github.event.inputs.themes }}"
          else
            THEMES="${{ steps.config.outputs.themes }}"
          fi
          
          echo "Generating podcast with themes: $THEMES"
          
          # Run orchestrator
          python3 -m src.orchestrator \
            --themes $(echo $THEMES | tr ',' ' ') \
            --enable-audio
      
      - name: Generate RSS feed
        run: |
          python3 -m src.publishers.rss_generator
      
      - name: Commit and push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          # Add generated files
          git add episodes/*.mp3 episodes/*.txt episodes/feed.xml episodes/dashboard.json episodes/summary.json
          
          # Commit if there are changes
          if ! git diff --staged --quiet; then
            git commit -m "chore: auto-generate podcast episode $(date +'%Y-%m-%d')"
            git push
          else
            echo "No changes to commit"
          fi
      
      - name: Upload episode artifacts
        uses: actions/upload-artifact@v4
        with:
          name: podcast-episode-${{ github.run_number }}
          path: |
            episodes/*.mp3
            episodes/*.txt
            episodes/feed.xml
          retention-days: 30
      
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./episodes
          publish_branch: gh-pages
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
          commit_message: 'deploy: podcast episode ${{ github.run_number }}'

      - name: Notify on failure
        if: failure()
        run: |
          echo "::warning::Podcast generation failed. Check logs for details."
